name: Build

# Pull requests and pushes to main build the image and check its plugins.
# A tag <OpenSearch version>-<build>, such as 3.8.0-1, also publishes
# ghcr.io/canastawiki/canasta-opensearch:<tag>. Published tags are never
# overwritten: a rebuild gets the next build number.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+-[0-9]+']

env:
  IMAGE: ghcr.io/canastawiki/canasta-opensearch

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the Dockerfile's OpenSearch version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^ARG OPENSEARCH_VERSION=//p' Dockerfile)
          case "$GITHUB_REF_NAME" in
            "$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not start with the Dockerfile's OpenSearch version $version"; exit 1 ;;
          esac

      - name: Refuse to overwrite a published tag
        if: github.ref_type == 'tag'
        run: |
          if docker manifest inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME is already published"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the runner and check the plugins
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: canasta-opensearch:test

      - run: ./check-plugins.sh canasta-opensearch:test

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for amd64 and arm64
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
